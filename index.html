<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DICA Varemo - Madurez Digital</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>

<div class="container">
    <h2>Evaluación de Nivel de Madurez Digital</h2>
    
    <!-- SECCIÓN 1: EVALUACIÓN INICIAL -->
    <div class="seccion-varemo inicial">
        <h3 class="seccion-titulo text-azul">Evaluación Inicial</h3>
        
        <div id="table-capture-inicial" class="table-capture">
            <table id="data-table-inicial" class="data-table">
                <thead>
                    <tr class="header-inicial">
                        <th>Ejes</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>SEO local</td><td class="punto-val"><input type="number" class="dato dato-inicial" value="0" step="0.01" min="0" max="100"><span class="captura-texto captura-texto-inicial">0</span></td></tr>
                    <tr><td>Web y SEO</td><td class="punto-val"><input type="number" class="dato dato-inicial" value="0" step="0.01" min="0" max="100"><span class="captura-texto captura-texto-inicial">0</span></td></tr>
                    <tr><td>Venta online</td><td class="punto-val"><input type="number" class="dato dato-inicial" value="0" step="0.01" min="0" max="100"><span class="captura-texto captura-texto-inicial">0</span></td></tr>
                    <tr><td>RRSS</td><td class="punto-val"><input type="number" class="dato dato-inicial" value="0" step="0.01" min="0" max="100"><span class="captura-texto captura-texto-inicial">0</span></td></tr>
                    <tr><td>Procesos</td><td class="punto-val"><input type="number" class="dato dato-inicial" value="0" step="0.01" min="0" max="100"><span class="captura-texto captura-texto-inicial">0</span></td></tr>
                </tbody>
                <tfoot>
                    <tr class="total-row total-row-inicial">
                        <td></td>
                        <td id="total-val-inicial" class="total-val">0.00</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="actions">
            <button class="btn-inicial" onclick="descargarTablaInicial()">Descargar Tabla Inicial PNG</button>
        </div>

        <div class="canvas-container" id="canvas-container-inicial">
            <canvas id="radarChartInicial"></canvas>
        </div>

        <div class="actions">
            <button class="btn-inicial" onclick="descargarGraficoInicial()">Descargar Gráfico Inicial PNG</button>
        </div>
    </div>
    
    <hr class="seccion-divider">
    
    <!-- SECCIÓN 2: EVOLUCIÓN -->
    <div class="seccion-varemo evolucion">
        <h3 class="seccion-titulo text-amarillo">Evolución / Evaluación Final</h3>
        
        <div id="table-capture-evolucion" class="table-capture">
            <table id="data-table-evolucion" class="data-table">
                <thead>
                    <tr class="header-evolucion">
                        <th>Ejes</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>SEO local</td><td class="punto-val"><input type="number" class="dato dato-evolucion" value="0" step="0.01" min="0" max="100"><span class="captura-texto captura-texto-evolucion">0</span></td></tr>
                    <tr><td>Web y SEO</td><td class="punto-val"><input type="number" class="dato dato-evolucion" value="0" step="0.01" min="0" max="100"><span class="captura-texto captura-texto-evolucion">0</span></td></tr>
                    <tr><td>Venta online</td><td class="punto-val"><input type="number" class="dato dato-evolucion" value="0" step="0.01" min="0" max="100"><span class="captura-texto captura-texto-evolucion">0</span></td></tr>
                    <tr><td>RRSS</td><td class="punto-val"><input type="number" class="dato dato-evolucion" value="0" step="0.01" min="0" max="100"><span class="captura-texto captura-texto-evolucion">0</span></td></tr>
                    <tr><td>Procesos</td><td class="punto-val"><input type="number" class="dato dato-evolucion" value="0" step="0.01" min="0" max="100"><span class="captura-texto captura-texto-evolucion">0</span></td></tr>
                </tbody>
                <tfoot>
                    <tr class="total-row total-row-evolucion">
                        <td></td>
                        <td id="total-val-evolucion" class="total-val">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="actions">
            <button class="btn-evolucion" onclick="descargarTablaEvolucion()">Descargar Tabla Evolución PNG</button>
        </div>

        <div class="canvas-container" id="canvas-container-evolucion">
            <canvas id="radarChartEvolucion"></canvas>
        </div>

        <div class="actions">
            <button class="btn-evolucion" onclick="descargarGraficoEvolucion()">Descargar Gráfico Evolución PNG</button>
        </div>
    </div>
</div>

<script src="index.js"></script>

</body>
</html>
